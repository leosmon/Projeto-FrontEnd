<!DOCTYPE html>
<html lang="pt-BR"> <!--  idioma da página -->
<head>
    <meta charset="UTF-8"> <!-- Suporte a acentos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsividade -->
    <title>Login - Search Book</title> <!-- Corrigido: título estava "Cadastro" -->
    <!-- CSS global e específico -->
    <link rel="stylesheet" href="Style/Style2.css">
    <link rel="stylesheet" href="Style/Login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
    
</head>

<body>
    
  <!-- HEADER -->
  <div id="header-container"></div>

    <!-- CONTAINER PRINCIPAL: imagem + formulário -->
    <main class="login-main">
    <!-- Lado esquerdo com imagem e mensagem -->
    <div class="login-left">
      <img alt="Imagem ilustrativa de login" src="/conteudo/foto login.png" class="login-image">
      <div class="login-overlay"></div>
      <div class="login-message">
        <div class="login-icon">
          <svg width="32" height="32" fill="none" viewBox="0 0 24 24">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke="white" stroke-width="2" stroke-linecap="round"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" stroke="white" stroke-width="2"></path>
          </svg>
        </div>
        <h2>Bem-vindo de volta!</h2>
        <p>Conecte-se com leitores, explore livros e continue sua jornada literária.</p>
      </div>
    </div>

    <!-- Lado direito com formulário -->
    <div class="login-right">
      <div class="login-box">
        <div class="login-logo">
          <span class="brand"><span class="blue">Search</span><span class="orange">Book</span></span>
        </div>
        <h1>Faça Seu Login</h1>
        <p class="subtitle">Entre na sua conta para continuar</p>

        <form id="login-form">
          <div class="field">
            <label for="usuarioLogin">Nome de Usuário</label>
            <input id="usuarioLogin" name="login" type="text" placeholder="Nome de Usuário" required>
          </div>
          <div class="field">
            <label for="senhaLogin">Senha</label>
            <input id="senhaLogin" name="senha" type="password" placeholder="Senha" required>
          </div>
          <div class="forgot">
            <a href="#">Esqueceu sua Senha?</a>
            <p id="login-erro" class="login-erro-msg" style="display:none;"></p>
<button type="submit" class="buton-login">Entrar</button>
          </div>
          
        </form>

        <p class="register">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
      </div>
    </div>
  </main>

    <!-- FOOTER -->
     <div id="footer"></div>

  <script src="js/header-footer.js"></script>
  <script src="js/login.js"></script>
  <script src="js/Script.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
