<!doctype html>
<html lang="pt-BR"> <!-- Idioma definido para português -->

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Book - Conectando Leitores</title> <!-- Título mais descritivo -->
  <link rel="stylesheet" href="Style/Style.css" />

  <!-- Importação de fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;800&family=Roboto:wght@400;500&display=swap"
    rel="stylesheet" />
</head>

<body class="light">
  
  <!-- HEADER -->
  <div id="header-container"></div>


  <!-- BARRA DE BUSCA -->
  <section id="search-bar-background" aria-label="Barra de busca de livros">
    <div class="search-title">
      <h2 id="site-title">Conectando <span class="highlight">Leitores</span></h2>
      <p>O que você procura pode estar aqui</p>
    </div>

    <div id="search-bar-container">
      <!-- Tipo de busca -->
      <fieldset class="tipo-busca" aria-label="Tipo de busca">
        <label><input type="radio" name="tipo" value="venda" checked> <span>Venda</span></label>
        <label><input type="radio" name="tipo" value="troca"> <span>Troca</span></label>
        <label><input type="radio" name="tipo" value="leitura"> <span>Leitura</span></label>
      </fieldset>

      <!-- Inputs -->
      <div class="inputs">
        <div class="input-box">
          <svg width="18" height="18" fill="none" stroke="#94a3b8" stroke-width="2" viewBox="0 0 24 24"
            aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input id="search-bar-livro" type="text" placeholder="Autor, Livro ou Gênero"
            aria-label="Buscar por autor, livro ou gênero">
        </div>

        <div class="input-box">
          <svg width="18" height="18" fill="none" stroke="#94a3b8" stroke-width="2" viewBox="0 0 24 24"
            aria-hidden="true">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <input id="search-bar-local" type="text" placeholder="Cidade, Estado ou Região"
            aria-label="Buscar por localização">
        </div>

        <!-- Botão -->
        <button id="search-button" aria-label="Pesquisar livros">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"
            aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          Pesquisar
        </button>
      </div>
    </div>
  </section>

  <!-- SEÇÃO DE LIVROS -->
  <section id="mais-lidos" class="mais-lidos" aria-label="Livros mais lidos">
    <div class="cabecalho">
      <div>
        <p class="tag">TENDÊNCIAS</p>
        <h2>Os Mais Lidos no Momento</h2>
      </div>
      <a href="#" class="ver-todos">Ver todos →</a>
    </div>

    <div class="relative">
      <div id="carrosel-livros-pg-inicial"
        class="flex gap-5 overflow-hidden mx-2 transition-transform duration-400 ease-in-out"
        aria-label="Carrossel de livros">
        <!-- Cards dos livros via JS -->
      </div>
    </div>
  </section>

  <!-- SEÇÃO DE CADASTRO -->
  <section class="cadastro px-6 pb-14" aria-label="Seção de cadastro">
    <div class="cadastro-container max-w-4xl mx-auto rounded-3xl p-10 text-center relative overflow-hidden">
      <div class="decorativo decorativo-top"></div>
      <div class="decorativo decorativo-bottom"></div>

      <h2 class="cadastro-titulo">Pronto para começar a leitura?</h2>
      <p class="cadastro-texto">Cadastre-se gratuitamente e conecte-se a milhares de leitores apaixonados por livros.
      </p>

      <a href="/cadastro.html" class="cadastro-botao" aria-label="Criar conta grátis">
        Criar conta grátis
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"
          aria-hidden="true">
          <path d="M5 12h14M12 5l7 7-7 7"></path>
        </svg>
      </a>
    </div>
  </section>

  <!-- RODAPÉ -->
  <div id="footer"></div>
 
  <script src="livros.js"></script>
  <script src="Script.js"></script>
  <script src="header-footer.js"></script>
</body>

</html>
