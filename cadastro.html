
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - SearchBook</title>
    <link rel="stylesheet" href="Style/cadastro.css">
    <link rel="stylesheet" href="Style/Style2.css">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">

    <script src="https://unpkg.com/imask"></script>
    
</head> 

<body>


    <!-- HEADER -->
    <div id="header-container"></div>

    <main>
        <div class="container">
            <!-- Título -->
            <h2>Cadastre-se no Search Book</h2>
            <form id="form" aria-label="Formulário de cadastro de usuário">
                <div class="form-container">

                    <!-- Dados Pessoais -->
                    <section aria-label="Dados pessoais">
                        <p class="section-title">Dados Pessoais</p>
                        <div class="row">
                            <div class="field">
                                <label for="nome">Nome</label>
                                <input id="nome" name="nome" type="text" placeholder="João da Silva"
                                    aria-label="Digite seu nome completo">
                            </div>
                            <div class="field">
                                <label for="cpf">CPF</label>
                                <input id="cpf" name="cpf" type="text" placeholder="000.000.000-00"
                                    aria-label="Digite seu CPF">
                            </div>
                        </div>
                    </section>

                    <!-- Endereço -->
                    <section aria-label="Endereço">
                        <p class="section-title">Endereço</p>
                        <div class="row">
                            <div class="field">
                                <label for="cep">CEP</label>
                                <input id="cep" name="cep" type="text" placeholder="00000-000"
                                    aria-label="Digite seu CEP">
                            </div>
                            <div class="field">
                                <button type="button" id="buscar-cep" aria-label="Buscar endereço pelo CEP">Buscar
                                    CEP</button>
                            </div>
                        </div>
                        <div class="row">
                            <div class="field">
                                <label for="rua">Rua</label>
                                <input id="rua" name="rua" type="text" placeholder="Rua das Flores">
                            </div>
                            <div class="field">
                                <label for="bairro">Bairro</label>
                                <input id="bairro" name="bairro" type="text" placeholder="Centro">
                            </div>
                        </div>
                        <div class="row">
                            <div class="field">
                                <label for="cidade">Cidade</label>
                                <input id="cidade" name="cidade" type="text" placeholder="São Paulo">
                            </div>
                            <div class="field small">
                                <label for="estado">Estado (UF)</label>
                                <input id="estado" name="estado" type="text" placeholder="SP">
                            </div>
                        </div>
                    </section>

                    <!-- Contato -->
                    <section aria-label="Contato">
                        <p class="section-title">Contato</p>
                        <div class="row">
                            <div class="field">
                                <label for="telefone">Telefone Fixo</label>
                                <input id="telefone" name="telefone" type="text" placeholder="(21) 3333-4444">
                            </div>
                            <div class="field">
                                <label for="celular">Celular</label>
                                <input id ="celular" id="phone-mask" id="celular" name="celular" type="text" placeholder="(21) 99999-9999">
                            </div>
                        </div>
                    </section>

                    <!-- Dados de Acesso -->
                    <section aria-label="Dados de acesso">
                        <p class="section-title">Dados de Acesso</p>
                        <div class="row">
                            <div class="field">
                                <label for="usuario">Usuário (Login)</label>
                                <input id="usuario" name="usuario" type="text" placeholder="joao.silva"
                                maxlength="6" pattern="[A-Za-zÀ-ÿ]+" title="O usuário deve conter apenas letras sem numeros (máx. 6 caracteres)">
                            </div>
                            <div class="field">
                                <label for="senha">Senha</label>
                                <input id="senha" name="senha" type="password" placeholder="••••••••"
                                maxlength="8" pattern="[A-Za-zÀ-ÿ]+" title="A senha deve conter apenas letras sem numeros (máx. 8 caracteres)">
                            </div>
                        </div>
                        <div class="row">
                            <div class="field half">
                                <label for="confirmarSenha">Confirmar Senha</label>
                                <input id="confirmarSenha" name="confirmarSenha" type="password" placeholder="••••••••"
                                maxlength="8" pattern="[A-Za-zÀ-ÿ]+" title="A senha deve conter apenas letras sem numeros (máx. 8 caracteres)">
                            </div>
                        </div>
                    </section>

                    <section aria-label="Preferências">
                        <p class="section-title">Quero</p>
                        <div class="grid">
                            <label for="venda">
                                <input id="venda" type="checkbox" name="tipo" value="venda">
                                Quero Vender Livros
                            </label>
                            <label for="troca">
                                <input id="troca" type="checkbox" name="tipo" value="troca">
                                Quero Trocar Livros
                            </label>
                            <label for="compra">
                                <input id="compra" type="checkbox" name="tipo" value="compra">
                                Quero Comprar Livros
                            </label>
                            <label for="leitura">
                                <input id="leitura" type="checkbox" name="tipo" value="leitura">
                                Quero Participar de Grupo de Leitura
                            </label>
                        </div>
                    </section>

                    <!-- Termos -->
                    <p class="terms">Ao se cadastrar, você concorda com os nossos
                        <a href="#">Termos de Uso</a> e
                        <a href="#">Política de Privacidade</a>.
                    </p>

                    <!-- Botão -->
                    <button type="submit" id="cadastro" class="btn-submit">Cadastrar</button>
                    <p class="login-link">Já tem uma conta? <a href="/login">Faça login</a></p>
                </div>
            </form>
    </main>

    <!-- FOOTER -->
     <div id="footer"></div>

    <!-- SCRIPTS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/header-footer.js"></script>
    <script src="js/Script.js" defer></script>
    <script src="js/cadastro.js"></script>
    <script src="js/imask.js"></script>
    




</body>

</html>
