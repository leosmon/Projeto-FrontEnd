<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="titulo-aba">Search Book - Detalhes do Livro</title>
  <link rel="stylesheet" href="Style/Style2.css" />
  <link rel="stylesheet" href="Style/livro.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="Style/avaliacoes.css">


  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;800&family=Roboto:wght@400;500&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="header-container"></div>

  <main class="livro-detalhe-main">
    <div class="secao-conteudo">
      <div id="livro-carregando" class="livro-carregando">Carregando informações do livro...</div>

      <div id="livro-conteudo" class="livro-detalhe-grid" style="display:none;">
        <div class="livro-detalhe-capa">
          <img id="livro-capa-img" src="" alt="" />
        </div>

        <div class="livro-detalhe-info">
          <h1 id="livro-titulo" translate="no"></h1>
          <p class="livro-detalhe-autor" id="livro-autor" translate="no"></p>
          <p class="livro-detalhe-meta" id="livro-publicacao"></p>

          <div class="livro-detalhe-assuntos" id="livro-assuntos"></div>

          <h2>Sinopse</h2>
          <p class="livro-detalhe-sinopse" id="livro-sinopse">Sinopse não disponível para este título.</p>

          <p class="livro-detalhe-preco" style="font-size: 24px; font-weight: 800; color: #ff8400; margin: 15px 0;">
            R$ <span id="livro-preco">39,90</span>
          </p>

          <div class="livro-detalhe-acoes">
            <button class="btn-feedback" id="btn-adicionar-carrinho">🛒 Adicionar ao Carrinho</button>
            <a id="link-openlibrary" href="#" target="_blank" rel="noopener" class="btn-outline azul">
              
            </a>
          </div>
          <!-- Avaliações do Livro -->
          <section id="livro-avaliacoes-secao" class="livro-avaliacoes-secao"
            style="margin-top: 28px; padding-top: 20px; border-top: 1px solid;">
            <h2 style="font-size: 20px; margin-bottom: 8px;">Avaliações dos leitores</h2>
            <p id="livro-avaliacoes-resumo" >
              Nenhuma avaliação registrada para este título ainda.
            </p>
            <div id="livro-avaliacoes-lista" style="display: flex; flex-direction: column; gap: 12px;"></div>
          </section>

          <!-- Aviso visual discreto quando adicionado ao carrinho (sem alert) -->
          <div id="aviso-carrinho"
            style="display: none; color: #28a745; font-weight: 600; margin-top: 12px; font-size: 14px;">
            ✅ Livro adicionado ao carrinho! <a href="carrinho.html"
              style="color: #007BFF; text-decoration: underline;">Ir para o carrinho</a>
          </div>
        </div>
      </div>

      <div id="livro-erro" class="livro-carregando" style="display:none;">
        Não foi possível carregar este livro. <a href="index.html">Voltar à página inicial</a>
      </div>
    </div>
  </main>

  <div id="footer"></div>


  <script src="js/header-footer.js"></script>
  <script src="js/livro-detalhe.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
